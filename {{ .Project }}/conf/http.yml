http:
  addr: ":{{ or .Scaffold.http_port "8080" }}"
  timeout: {{ or .Scaffold.http_timeout "30s" }}
  readHeaderTimeout: 5s
  idleTimeout: 2m
  docs:
    enabled: false
    servers:
      - url: "https://example.com/api/{{ .Computed.service_name_kebab }}"
        description: "prod"
      - url: "https://dev.example.com/api/{{ .Computed.service_name_kebab }}"
        description: "dev"
      - url: "http://127.0.0.1:{{ or .Scaffold.http_port "8080" }}"
        description: "local"
  profiler:
    enabled: false
    addr: "127.0.0.1:6060"
