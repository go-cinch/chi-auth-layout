http:
  addr: ":{{ or .Scaffold.http_port "8080" }}"
  timeout: {{ or .Scaffold.http_timeout "30s" }}
  readHeaderTimeout: 5s
  idleTimeout: 2m
  # JSON request limits in bytes. Restart after changes; each handler selects a category.
  bodyLimits:
    authChallenge: 1024
    sliderChallenge: 2048
    authVerification: 4096
    auth: 16384
    business: 1048576
    dictionary: 2097152
  docs:
    enabled: false
    servers:
      - url: "https://example.com/api/{{ .Computed.service_name_kebab }}"
        description: "prod"
      - url: "https://dev.example.com/api/{{ .Computed.service_name_kebab }}"
        description: "dev"
      - url: "http://127.0.0.1:{{ or .Scaffold.http_port "8080" }}"
        description: "local"
  profiler:
    enabled: false
    addr: "127.0.0.1:6060"
