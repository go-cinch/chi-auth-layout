<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Computed.service_name_final }} API Docs</title>
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    #docs-error {
      display: none;
      margin: 24px;
      padding: 16px 18px;
      border: 1px solid #f3b4ae;
      border-radius: 4px;
      background: #fff5f5;
      color: #b42318;
      font: 600 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui.css">
</head>
<body>
  <div id="docs-error"></div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.29.1/swagger-ui-standalone-preset.js"></script>
  <script>
    function showError(message) {
      const error = document.getElementById("docs-error");
      error.textContent = message;
      error.style.display = "block";
    }

    window.onload = function () {
      try {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          persistAuthorization: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout"
        });
      } catch (error) {
        showError(`Failed to load API documentation: ${error.message}`);
      }
    };
  </script>
</body>
</html>
